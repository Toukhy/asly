<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asly | أصلي</title>
<meta name="description" content="Compare phone prices and warranty across Egyptian stores.">
<meta name="robots" content="noindex, nofollow">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f1; --card:#fff; --ink:#1b1f1d; --muted:#667068; --line:#e3e1d8; --soft:#efede6;
  --brand:#0f6b4f; --brand-ink:#fff;
  --a:#0f6b4f; --a-bg:#e3f3ec; --b:#8a5a00; --b-bg:#fbf0d6; --n:#8a2f2f; --n-bg:#f9e4e2; --u:#4b5563; --u-bg:#e9ebee;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121513; --card:#1b201d; --ink:#eef1ee; --muted:#9aa59d; --line:#2c332f; --soft:#171c19;
    --brand:#3fbf91; --brand-ink:#08150f; --a:#5fd6a8; --a-bg:#15342a; --b:#e5b95c; --b-bg:#3a2e10; --n:#f09a94; --n-bg:#3a1c1a; --u:#b4bcc6; --u-bg:#262b30}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px}
.wrap.wide{max-width:1100px}
header{display:flex;align-items:center;justify-content:space-between;padding:4px 0 8px}
.logo{font-size:26px;font-weight:700;color:var(--brand);background:none;border:0;padding:0;font-family:inherit;cursor:pointer}
.lang{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:6px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
button:focus-visible,a:focus-visible,[role=button]:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.hero{font-size:28px;font-weight:700;line-height:1.3;margin:28px 0 6px}
.sub{color:var(--muted);margin:0 0 16px}
h2.pg{font-size:22px;margin:10px 0 4px}
h3{font-size:16px;margin:20px 0 4px}
p{margin:6px 0}
form.s{display:flex;gap:8px;margin:6px 0 10px}
input[type=search],input[type=text],textarea{min-width:0;padding:12px 14px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:100%}
input[type=search]{flex:1;font-size:17px;padding:14px 16px}
textarea{min-height:96px;resize:vertical}
.go{padding:0 22px;border:0;border-radius:12px;background:var(--brand);color:var(--brand-ink);font:inherit;font-weight:600;cursor:pointer;min-height:44px}
.go.sec{background:var(--card);color:var(--brand);border:1px solid var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.trust{display:grid;gap:8px;margin:26px 0}
.trust div{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px}
.dot{width:24px;height:24px;border-radius:50%;background:var(--a-bg);color:var(--a);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.sum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}
.sum h2{margin:0;font-size:19px}
.spec{color:var(--muted);font-size:14px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px dashed var(--line);font-size:15px}
.row b{white-space:nowrap}
.safe{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--a-bg);font-size:15px}
.safe.warn{background:var(--b-bg)}
.banner{border-radius:12px;padding:10px 14px;font-size:14.5px;margin:10px 0;background:var(--b-bg)}
.banner.info{background:var(--soft);border:1px solid var(--line)}
.small{font-size:13px;color:var(--muted)}
.list{display:grid;gap:10px;margin-top:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
.item:hover{border-color:var(--brand)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.store{font-weight:600}
.price{font-size:24px;font-weight:700}
.price small{font-size:13px;font-weight:400;color:var(--muted)}
.meta{color:var(--muted);font-size:14px;margin:3px 0 8px}
.badge{display:inline-block;font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;margin-inline-end:6px;margin-bottom:4px}
.badge.A{background:var(--a-bg);color:var(--a)}
.badge.B{background:var(--b-bg);color:var(--b)}
.badge.N{background:var(--n-bg);color:var(--n)}
.badge.U{background:var(--u-bg);color:var(--u)}
.badge.c{border:1px solid var(--line);color:var(--muted);font-weight:400}
.flag{font-size:14px;color:var(--n);margin:4px 0 0}
.empty{color:var(--muted);margin-top:16px}
.foot{margin-top:28px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.nav{display:flex;gap:16px;flex-wrap:wrap;margin-top:24px;font-size:14px}
.nav a,.back{color:var(--muted);text-decoration:underline;cursor:pointer;background:none;border:0;font:inherit;padding:0}
.back{display:inline-block;margin:6px 0;color:var(--brand)}
.tier{display:flex;gap:12px;margin:10px 0;align-items:flex-start;font-size:15px}
.tier .badge{flex:none;margin-top:2px;min-width:72px;text-align:center}
.ex{color:var(--muted);font-size:13px;margin-top:2px}
.radio{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:6px 0;background:var(--card);font-size:15px;cursor:pointer}
.radio input{accent-color:var(--brand);width:18px;height:18px;margin:0}
.lbl{display:block;font-size:14px;color:var(--muted);margin:14px 0 4px}
.refbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.result{background:var(--a-bg);border-radius:12px;padding:12px 14px;margin-top:14px}
.result textarea{margin:8px 0;font-size:14px;min-height:140px}
ul.plain{margin:6px 0;padding-inline-start:22px}
/* sheet */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:11;max-width:560px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;padding:14px 18px 24px;max-height:92vh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.grab{width:44px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin:12px 0}
.kv span:nth-child(odd){color:var(--muted)}
.callout{background:var(--b-bg);border-radius:12px;padding:12px 14px;font-size:14.5px;margin:12px 0}
.callout b{display:block;margin-bottom:2px}
.callout ul{margin:6px 0 0;padding-inline-start:20px}
.callout li{margin:2px 0}
a.buy{display:inline-block;padding:10px 20px;border-radius:12px;background:var(--brand);color:var(--brand-ink);text-decoration:none;font-weight:600}
.sheetlinks{margin-top:12px;font-size:14px}
.sheetlinks a{color:var(--muted)}
.close{position:absolute;top:10px;inset-inline-start:12px;background:none;border:0;color:var(--muted);font:inherit;font-size:14px;cursor:pointer}
/* desktop comparison */
.layout{display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:start}
.side{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:14.5px;position:sticky;top:12px}
.side h4{margin:12px 0 4px;font-size:13px;color:var(--muted);font-weight:600}
.side h4:first-child{margin-top:2px}
.chk{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer}
.chk input{accent-color:var(--brand);width:16px;height:16px;margin:0}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:14.5px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--soft);font-size:13px;color:var(--muted);font-weight:600}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--soft)}
tr.best td{background:var(--a-bg)}
td.pc{font-weight:700;white-space:nowrap}
a.open{display:inline-block;padding:5px 12px;border-radius:10px;border:1px solid var(--brand);color:var(--brand);text-decoration:none;font-weight:600;font-size:14px}
@media (prefers-reduced-motion:no-preference){.item,tbody tr{transition:border-color .15s}}
</style>
</head>

}
function setHash(h){
  if(location.hash === h || (!h && !location.hash)){ readHash(); render(); }
  else location.hash = h;
}
function go(q,pid){ setHash(q ? "#q="+encodeURIComponent(q)+(pid?"&p="+pid:"") : ""); }
function nav(v,ref){ setHash("#v="+v+(ref?"&ref="+encodeURIComponent(ref):"")); }

function daysSince(iso){ return Math.floor((Date.now() - Date.parse(iso+"T12:00:00Z")) / 86400000); }

function render(){
  var t = T[lang];
  document.documentElement.lang = lang; document.documentElement.dir = t.dir;
  $("lang").textContent = t.lang; $("logo").textContent = t.brand; $("foot").textContent = t.foot;
  document.title = lang==="ar" ? "أصلي | Asly" : "Asly | أصلي";
  closeSheet();
  var m = $("main"); m.textContent = "";
  $("wrap").classList.remove("wide");
  renderNav();
  if(state.v==="how") return renderHow(m);
  if(state.v==="report") return renderReport(m);
  if(state.v==="bot") return renderBot(m);
  renderSearchPage(m);
}

function renderNav(){
  var t = T[lang], n = $("nav"); n.textContent = "";
  var links = [["how",t.navHow],["report",t.navReport]];
  if(CONTACT_EMAIL) links.push(["bot",t.navStores]);   // the stores page stays unlinked until a real contact is set
  links.forEach(function(p){
    var a = el("a",null,p[1]); a.href = "#v="+p[0]; n.appendChild(a);
  });
}

function backLink(m){
  var b = el("button","back","< "+T[lang].back); b.type="button";
  b.onclick = function(){ if(history.length>1) history.back(); else go(""); };
  m.appendChild(b);
}

/* ---------- search, results ---------- */
function searchForm(){
  var t = T[lang];
  var form = el("form","s"); form.setAttribute("role","search");
  var inp = el("input"); inp.type="search"; inp.id="q"; inp.placeholder=t.ph; inp.value=state.q; inp.setAttribute("aria-label",t.ph); inp.autocomplete="off";
  var btn = el("button","go",t.go); btn.type="submit";
  form.appendChild(inp); form.appendChild(btn);
  form.addEventListener("submit",function(e){e.preventDefault(); go(inp.value.trim())});
  return form;
}

function renderSearchPage(m){
  var t = T[lang];
  if(!state.q){
    m.appendChild(el("div","hero",t.hero));
    m.appendChild(el("p","sub",t.sub));
    m.appendChild(searchForm());
    var ex = el("div","chips");
    t.examples.forEach(function(x){ var b = el("button","chip",x); b.type="button"; b.onclick=function(){go(x)}; ex.appendChild(b); });
    m.appendChild(ex);
    var tr = el("div","trust");
    t.trust.forEach(function(x,i){ var d = el("div"); d.appendChild(el("span","dot",String(i+1))); d.appendChild(el("span",null,x)); tr.appendChild(d); });
    m.appendChild(tr);
    return;
  }
  m.appendChild(searchForm());
  var found = search(state.q);
  if(!found.length){
    m.appendChild(el("p","empty",t.noResult(state.q)));
    m.appendChild(el("p","small",t.tryThese));
    var b = el("button","go sec",t.askPhone); b.type="button"; b.style.marginTop="10px";
    b.onclick = function(){ nav("report","request:"+state.q); };
    m.appendChild(b);
    return;
  }
  var cur = found.filter(function(p){return p.id===state.pid})[0] || found[0];
  if(found.length>1){
    var pick = el("div","chips");
    found.forEach(function(p){
      var b2 = el("button","chip",p.name[lang]); b2.type="button"; b2.setAttribute("aria-pressed",String(p===cur));
      b2.onclick=function(){go(state.q,p.id)}; pick.appendChild(b2);
    });
    m.appendChild(pick);
  }
  var days = daysSince(CHECKED);
  if(days>=2) m.appendChild(el("div","banner",t.stale(days)));
  var down = {}; SOURCES_DOWN.forEach(function(r){ if(cur.L.some(function(x){return x.r===r})) down[r]=1; });
  Object.keys(down).forEach(function(r){ m.appendChild(el("div","banner info",t.down(r))); });
  renderProduct(m, cur);
}

function summary(prod){
  var t = T[lang];
  var L = prod.L.slice().sort(function(a,b){return a.p-b.p});
  var pool = L.filter(function(x){return x.cond!=="refurb"});
  var hasRefurb = pool.length !== L.length;
  var cheapest = pool[0];
  var best = pool.filter(function(x){return x.tier==="A"})[0], isA = true;
  if(!best){ best = pool.filter(function(x){return x.tier==="B"})[0]; isA = false; }
  var s = el("section","sum");
  s.appendChild(el("h2",null,prod.name[lang]));
  s.appendChild(el("div","spec",prod.spec[lang]));
  var r1 = el("div","row"); r1.appendChild(el("span",null,t.cheap+": "+cheapest.r)); r1.appendChild(el("b",null,fmt(cheapest.p)+" "+t.egp)); s.appendChild(r1);
  if(best){
    var r2 = el("div","row"); r2.appendChild(el("span",null,(isA?t.bestA:t.bestB)+": "+best.r)); r2.appendChild(el("b",null,fmt(best.p)+" "+t.egp)); s.appendChild(r2);
    var d = best.p - cheapest.p, pc = Math.round(d/cheapest.p*1000)/10, msg, warn = false;
    if(!isA){ msg = t.onlyB(best.r, fmt(best.p)); warn = true; }
    else if(d===0) msg = t.same;
    else {
      msg = t.safeA(fmt(d), pc);
      msg += cheapest.tier==="N" ? t.tailN : cheapest.tier==="U" ? t.tailU : cheapest.tier==="B" ? t.tailB : "";
    }
    if(cheapest.flag) msg += t.tailFlag;
    s.appendChild(el("div","safe"+(warn?" warn":""),msg));
  } else {
    s.appendChild(el("div","safe warn",t.none));
  }
  if(hasRefurb) s.appendChild(el("div","small",t.refurbNote));
  return {node:s, L:L, best:best, isA:isA};
}

function verText(x){ var t = T[lang]; return x.ver ? (t.versions[x.ver]||x.ver) : ""; }

function renderProduct(m, prod){
  var sm = summary(prod);
  m.appendChild(sm.node);
  if(wideMQ.matches) renderWide(m, prod, sm); else renderCards(m, prod, sm);
}

function renderCards(m, prod, sm){
  var t = T[lang], L = sm.L;
  var tiers = ["A","B","N","U"].filter(function(k){return L.some(function(x){return x.tier===k})});
  var f = el("div","chips");
  ["all"].concat(tiers).forEach(function(k){
    var b = el("button","chip",k==="all"?t.all:t.tiers[k]); b.type="button"; b.setAttribute("aria-pressed",String(state.tier===k));
    b.onclick=function(){state.tier=k; render()}; f.appendChild(b);
  });
  m.appendChild(f);
  var shown = L.filter(function(x){return state.tier==="all"||x.tier===state.tier});
  m.appendChild(el("p","small",t.count(shown.length)));
  var list = el("div","list");
  shown.forEach(function(x){
    var it = el("article","item"); it.tabIndex = 0; it.setAttribute("role","button");
    var top = el("div","top");
    top.appendChild(el("span","store",x.r));
    var pr = el("span","price",fmt(x.p)+" "); pr.appendChild(el("small",null,t.egp)); top.appendChild(pr);
    it.appendChild(top);
    var ver = verText(x);
    it.appendChild(el("div","meta",t.seller(x.s)+(ver||x.c?" | ":"")+[ver,x.c].filter(Boolean).join(", ")));
    var bd = el("div");
    bd.appendChild(el("span","badge "+x.tier,x.w[lang]));
    if(x.cond==="refurb") bd.appendChild(el("span","badge c",t.sh.refc));
    it.appendChild(bd);
    if(x.flag) it.appendChild(el("div","flag","! "+x.flag[lang]));
    var open = function(){openSheet(x)};
    it.addEventListener("click",open);
    it.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){e.preventDefault(); open()} });
    list.appendChild(it);
  });
  m.appendChild(list);
}

function newFilters(L){
  var f = {tier:{}, cond:{new:true,refurb:false}, store:{}, ver:{}};
  L.forEach(function(x){ f.tier[x.tier]=true; f.store[x.r]=true; f.ver[x.ver||""]=true; });
  return f;
}
function passes(x,f){ return f.tier[x.tier] && (x.cond==="refurb" ? f.cond.refurb : f.cond.new) && f.store[x.r] && f.ver[x.ver||""]; }

function renderWide(m, prod, sm){
  var t = T[lang], tb = t.tbl, L = sm.L;
  $("wrap").classList.add("wide");
  if(!state.fl) state.fl = newFilters(L);
  var f = state.fl;
  var layout = el("div","layout");
  var side = el("aside","side");
  side.appendChild(el("h4",null,tb.filters));
  function group(title, items, getter, setter){
    side.appendChild(el("h4",null,title));
    items.forEach(function(it){
      var lab = el("label","chk"); var cb = el("input"); cb.type="checkbox"; cb.checked = !!getter(it.k);
      cb.onchange = function(){ setter(it.k, cb.checked); render(); };
      lab.appendChild(cb); lab.appendChild(el("span",null,it.label)); side.appendChild(lab);
    });
  }
  var present = function(arr){ return arr.filter(function(v,i,a){return a.indexOf(v)===i}) };
  group(tb.fWarranty, present(L.map(function(x){return x.tier})).sort().map(function(k){return {k:k,label:t.tiers[k]}}), function(k){return f.tier[k]}, function(k,v){f.tier[k]=v});
  group(tb.fCond, [{k:"new",label:tb.new},{k:"refurb",label:tb.refurb}], function(k){return f.cond[k]}, function(k,v){f.cond[k]=v});
  group(tb.fStore, present(L.map(function(x){return x.r})).map(function(r){return {k:r,label:r}}), function(k){return f.store[k]}, function(k,v){f.store[k]=v});
  group(tb.fVer, present(L.map(function(x){return x.ver||""})).map(function(v){return {k:v,label:v?(t.versions[v]||v):tb.unspecified}}), function(k){return f.ver[k]}, function(k,v){f.ver[k]=v});
  layout.appendChild(side);

  var right = el("div");
  var shown = L.filter(function(x){return passes(x,f)});
  right.appendChild(el("p","small",t.count(shown.length)));
  var table = el("table");
  var hr = el("tr");
  [tb.store,tb.seller,tb.price,tb.warranty,tb.ver,tb.rating,""].forEach(function(h){ hr.appendChild(el("th",null,h)); });
  var thead = el("thead"); thead.appendChild(hr); table.appendChild(thead);
  var tbody = el("tbody");
  shown.forEach(function(x){
    var tr = el("tr", sm.best===x && sm.isA ? "best" : ""); tr.tabIndex = 0; tr.setAttribute("role","button");
    tr.appendChild(el("td",null,x.r));
    tr.appendChild(el("td",null,x.s || t.sh.notread));
    tr.appendChild(el("td","pc",fmt(x.p)));
    var tw = el("td"); tw.appendChild(el("span","badge "+x.tier,x.w[lang])); if(x.flag) tw.appendChild(el("div","flag","! "+x.flag[lang])); tr.appendChild(tw);
    var tv = el("td",null,[verText(x),x.c].filter(Boolean).join(", ")); if(x.cond==="refurb") tv.appendChild(el("span","badge c",t.sh.refc)); tr.appendChild(tv);
    tr.appendChild(el("td",null,x.rt ? x.rt[0]+" ("+fmt(x.rt[1])+")" : "-"));
    var ta = el("td"); var a = el("a","open",t.openShort); a.href = x.u; a.target="_blank"; a.rel="noopener noreferrer"; a.setAttribute("aria-label",t.open(x.r));
    a.addEventListener("click",function(e){e.stopPropagation()}); ta.appendChild(a); tr.appendChild(ta);
    var open = function(){openSheet(x)};
    tr.addEventListener("click",open);
    tr.addEventListener("keydown",function(e){ if((e.key==="Enter"||e.key===" ") && e.target===tr){e.preventDefault(); open()} });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody); right.appendChild(table);
  right.appendChild(el("p","small",tb.hl));
  layout.appendChild(right);
  m.appendChild(layout);
}

/* ---------- sheet ---------- */
var lastFocus = null;
function openSheet(x){
  var t = T[lang], sh = t.sh;
  lastFocus = document.activeElement;
  var layer = $("layer"); layer.textContent = "";
  var dim = el("div","dim"); dim.onclick = closeSheet; layer.appendChild(dim);
  var s = el("div","sheet"); s.setAttribute("role","dialog"); s.setAttribute("aria-modal","true"); s.setAttribute("aria-label",x.r+" "+fmt(x.p));
  var cl = el("button","close",sh.close); cl.type="button"; cl.onclick = closeSheet; s.appendChild(cl);
  s.appendChild(el("div","grab"));
  var top = el("div","top"); top.appendChild(el("span","store",x.r));
  var pr = el("span","price",fmt(x.p)+" "); pr.appendChild(el("small",null,t.egp)); top.appendChild(pr); s.appendChild(top);
  var bd = el("div"); bd.appendChild(el("span","badge "+x.tier,x.w[lang])); if(x.cond==="refurb") bd.appendChild(el("span","badge c",sh.refc)); s.appendChild(bd);
  if(x.flag) s.appendChild(el("div","flag","! "+x.flag[lang]));
  var kv = el("div","kv");
  function kvp(k,v){ kv.appendChild(el("span",null,k)); kv.appendChild(el("span",null,v)); }
  kvp(sh.seller, x.s || sh.notread);
  kvp(sh.version, x.ver ? verText(x) : sh.notread);
  kvp(sh.cond, x.cond==="refurb" ? sh.refc : sh.newc);
  if(x.rt) kvp(sh.rating, sh.rate(x.rt[0], x.rt[1], x.r));
  kvp(sh.source, x.v ? sh.page : sh.search);
  kvp(sh.checked, sh.date);
  s.appendChild(kv);
  var co = el("div","callout"); co.appendChild(el("b",null,sh.cantTitle)); co.appendChild(el("span",null,sh.cant));
  var ul = el("ul"); sh.tips.forEach(function(x2){ ul.appendChild(el("li",null,x2)); }); co.appendChild(ul); s.appendChild(co);
  var a = el("a","buy",t.open(x.r)); a.href = x.u; a.target = "_blank"; a.rel = "noopener noreferrer"; s.appendChild(a);
  var links = el("div","sheetlinks"); var ra = el("a",null,sh.report); ra.href = "#v=report&ref="+encodeURIComponent(x.key); links.appendChild(ra); s.appendChild(links);
  layer.appendChild(s);
  document.body.style.overflow = "hidden";
  cl.focus();
}
function closeSheet(){
  var layer = $("layer");
  if(!layer.firstChild) return;
  layer.textContent = "";
  document.body.style.overflow = "";
  if(lastFocus && lastFocus.focus) { try{ lastFocus.focus(); }catch(e){} }
}
document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeSheet(); });

/* ---------- screen 4: how we read warranty ---------- */
function renderHow(m){
  var h = T[lang].how;
  backLink(m);
  m.appendChild(el("h2","pg",h.title));
  h.tiers.forEach(function(r){
    var row = el("div","tier"); row.appendChild(el("span","badge "+r[0],r[1]));
    var d = el("div"); d.appendChild(el("div",null,r[2])); if(r[3]) d.appendChild(el("div","ex",r[3])); row.appendChild(d); m.appendChild(row);
  });
  [[h.h2,h.p2],[h.h3,h.p3],[h.h4,h.p4],[h.h5,h.p5]].forEach(function(p){ m.appendChild(el("h3",null,p[0])); m.appendChild(el("p",null,p[1])); });
}

/* ---------- screen 5: report a mistake ---------- */
function renderReport(m){
  var t = T[lang], r = t.rep;
  backLink(m);
  m.appendChild(el("h2","pg",r.title));
  var ref = state.ref, listing = null, wanted = "";
  if(ref.indexOf("request:")===0){ wanted = ref.slice(8); ref = ""; }
  if(ref && BYKEY[ref]) listing = BYKEY[ref];
  var optKeys = listing ? ["price","warranty","stock","wrong","other"] : ["request","other"];
  var form = el("form");
  if(listing){
    var box = el("div","refbox"); box.appendChild(el("div","small",r.about));
    box.appendChild(el("div","store",listing.r+" | "+fmt(listing.p)+" "+t.egp));
    box.appendChild(el("div","meta",listing.prod.name[lang]+(listing.s?" | "+t.seller(listing.s):"")));
    form.appendChild(box);
  }
  form.appendChild(el("span","lbl",r.what));
  var chosen = optKeys[0];
  optKeys.forEach(function(k,i){
    var lab = el("label","radio"); var rb = el("input"); rb.type="radio"; rb.name="why"; rb.value=k; rb.checked = i===0;
    rb.onchange = function(){ chosen = k; };
    lab.appendChild(rb); lab.appendChild(el("span",null,r.opts[k])); form.appendChild(lab);
  });
  var phone = null;
  if(!listing){ form.appendChild(el("span","lbl",r.which)); phone = el("input"); phone.type="text"; phone.value = wanted; form.appendChild(phone); }
  form.appendChild(el("span","lbl",r.see));
  var ta = el("textarea"); ta.placeholder = r.seeph; form.appendChild(ta);
  form.appendChild(el("span","lbl",r.contact));
  var ct = el("input"); ct.type="text"; ct.placeholder = r.contactph; ct.autocomplete="off"; form.appendChild(ct);
  var send = el("button","go",r.send); send.type="submit"; send.style.marginTop="14px"; form.appendChild(send);
  form.appendChild(el("p","small",r.note));
  var out = el("div"); form.appendChild(out);
  form.addEventListener("submit",function(e){
    e.preventDefault();
    var L = r.lines, nl = "\n";
    var lines = [L.head];
    lines.push(L.listing+": "+(listing ? listing.r+", "+listing.prod.name[lang]+", "+fmt(listing.p)+" "+t.egp+(listing.s?", "+listing.s:"") : (phone && phone.value.trim()) || "-"));
    lines.push(L.problem+": "+r.opts[chosen]);
    if(ta.value.trim()) lines.push(L.details+": "+ta.value.trim());
    if(ct.value.trim()) lines.push(L.contact+": "+ct.value.trim());
    lines.push(L.page+": "+CHECKED);
    var text = lines.join(nl);
    out.textContent = "";
    var res = el("div","result"); res.appendChild(el("b",null,r.done)); res.appendChild(el("p","small",r.doneHelp));
    var box2 = el("textarea"); box2.readOnly = true; box2.value = text; res.appendChild(box2);
    var cp = el("button","go",r.copy); cp.type="button";
    cp.onclick = function(){
      var ok = function(){ cp.textContent = r.copied; };
      try{ navigator.clipboard.writeText(text).then(ok,function(){ box2.select(); document.execCommand("copy"); ok(); }); }
      catch(err){ box2.select(); try{ document.execCommand("copy"); ok(); }catch(e2){} }
    };
    res.appendChild(cp);
    if(REPORT_EMAIL){ var ma = el("a","go sec",r.mail); ma.style.display="inline-flex"; ma.style.alignItems="center"; ma.style.textDecoration="none"; ma.style.marginInlineStart="8px";
      ma.href = "mailto:"+REPORT_EMAIL+"?subject="+encodeURIComponent(L.head)+"&body="+encodeURIComponent(text); res.appendChild(ma); }
    out.appendChild(res);
  });
  m.appendChild(form);
}

/* ---------- screen 7: AslyBot ---------- */
function renderBot(m){
  var b = T[lang].bot;
  backLink(m);
  m.appendChild(el("h2","pg",b.title));
  m.appendChild(el("p",null,b.intro));
  m.appendChild(el("h3",null,b.h1)); m.appendChild(el("p",null,b.p1));
  m.appendChild(el("h3",null,b.h2));
  var ul = el("ul","plain"); b.li.forEach(function(x){ ul.appendChild(el("li",null,x)); }); m.appendChild(ul);
  m.appendChild(el("h3",null,b.h3));
  var bn = el("div","banner",(CONTACT_EMAIL || b.placeholder)+". "+b.contact); m.appendChild(bn);
  m.appendChild(el("h3",null,b.h4)); m.appendChild(el("p",null,b.p4));
}

$("lang").addEventListener("click",function(){
  lang = lang==="ar" ? "en" : "ar";
  try{ localStorage.setItem("asly-lang",lang); }catch(e){}
  render();
});
$("logo").addEventListener("click",function(){ go("") });
window.addEventListener("hashchange",function(){ readHash(); render(); window.scrollTo(0,0); });
if(wideMQ.addEventListener) wideMQ.addEventListener("change",function(){ render(); });
readHash(); render();
